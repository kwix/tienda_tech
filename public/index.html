<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda Tech - Dashboard de Administración</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
</head>
<body class="bg-gray-100 min-h-screen flex">

  <!-- Sidebar de Navegación -->
  <aside class="w-64 bg-gray-900 text-white min-h-screen p-5 flex flex-col justify-between">
    <div>
      <h1 class="text-2xl font-bold mb-8 text-blue-400">🛒 Tienda Tech</h1>
      <nav class="space-y-2">
        <button onclick="verModulo('productos')" class="w-full text-left px-4 py-3 rounded hover:bg-gray-800 transition">📦 CRUD Productos</button>
        <button onclick="verModulo('clientes')" class="w-full text-left px-4 py-3 rounded hover:bg-gray-800 transition">👥 CRUD Clientes</button>
        <button onclick="verModulo('ventas')" class="w-full text-left px-4 py-3 rounded hover:bg-gray-800 transition">💳 Registrar Venta</button>
        <button onclick="verModulo('consultas')" class="w-full text-left px-4 py-3 rounded hover:bg-gray-800 transition">📊 Consultas & SP / Vistas</button>
      </nav>
    </div>
    <div id="estado-conexion" class="text-xs text-gray-400">Verificando conexión a MySQL...</div>
  </aside>

  <!-- Contenido Principal -->
  <main class="flex-1 p-8">

    <!-- MÓDULO 1: PRODUCTOS (CRUD) -->
    <section id="mod-productos" class="modulo">
      <h2 class="text-2xl font-bold mb-4">Gestión de Productos</h2>
      <div class="bg-white p-6 rounded-lg shadow mb-6">
        <form id="form-producto" class="grid grid-cols-5 gap-4">
          <input type="text" id="p-nombre" placeholder="Nombre" required class="border p-2 rounded">
          <input type="text" id="p-categoria" placeholder="Categoría" required class="border p-2 rounded">
          <input type="number" min="0" step="0.01" id="p-precio" placeholder="Precio" required class="border p-2 rounded">
          <button type="submit" class="bg-blue-600 text-white rounded font-bold">Guardar Producto</button>
          <button type="button" id="cancelar-producto" class="hidden bg-gray-300 rounded font-bold">Cancelar</button>
        </form>
      </div>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead class="bg-gray-800 text-white">
            <tr><th class="p-3">ID</th><th class="p-3">Nombre</th><th class="p-3">Categoría</th><th class="p-3">Precio</th><th class="p-3">Acciones</th></tr>
          </thead>
          <tbody id="tbl-productos"></tbody>
        </table>
      </div>
    </section>

    <!-- MÓDULO 2: CLIENTES (CRUD) -->
    <section id="mod-clientes" class="modulo hidden">
      <h2 class="text-2xl font-bold mb-4">Gestión de Clientes</h2>
      <div class="bg-white p-6 rounded-lg shadow mb-6">
        <form id="form-cliente" class="grid grid-cols-5 gap-4">
          <input type="text" id="c-nombre" placeholder="Nombre completo" required class="border p-2 rounded">
          <input type="email" id="c-email" placeholder="Email" required class="border p-2 rounded">
          <input type="text" id="c-ciudad" placeholder="Ciudad" required class="border p-2 rounded">
          <button type="submit" class="bg-green-600 text-white rounded font-bold">Guardar Cliente</button>
          <button type="button" id="cancelar-cliente" class="hidden bg-gray-300 rounded font-bold">Cancelar</button>
        </form>
      </div>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead class="bg-gray-800 text-white">
            <tr><th class="p-3">ID</th><th class="p-3">Nombre</th><th class="p-3">Email</th><th class="p-3">Ciudad</th><th class="p-3">Acciones</th></tr>
          </thead>
          <tbody id="tbl-clientes"></tbody>
        </table>
      </div>
    </section>

    <!-- MÓDULO 3: REGISTRO DE VENTAS (STORED PROCEDURE) -->
    <section id="mod-ventas" class="modulo hidden">
      <h2 class="text-2xl font-bold mb-4">Registrar nueva venta</h2>
      <div class="bg-white p-6 rounded-lg shadow max-w-xl">
        <form id="form-venta" class="space-y-4">
          <div>
            <label class="block mb-1 font-semibold">Seleccionar Cliente:</label>
            <select id="v-cliente" class="w-full border p-2 rounded" required></select>
          </div>
          <div>
            <label class="block mb-1 font-semibold">Seleccionar Producto:</label>
            <select id="v-producto" class="w-full border p-2 rounded" required></select>
          </div>
          <div>
            <label class="block mb-1 font-semibold">Cantidad:</label>
            <input type="number" id="v-cantidad" min="1" value="1" class="w-full border p-2 rounded" required>
          </div>
          <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded font-bold hover:bg-purple-700">Registrar venta</button>
        </form>
      </div>
    </section>

    <!-- MÓDULO 4: CONSULTAS & VISTAS / SP -->
    <section id="mod-consultas" class="modulo hidden">
      <h2 class="text-2xl font-bold mb-4">Panel de Consultas (Vistas & SPs)</h2>
      <div class="flex gap-4 mb-6">
        <button onclick="cargarVistaVentas()" class="bg-indigo-600 text-white px-4 py-2 rounded">Vista: Resumen de Ventas</button>
        <div class="flex gap-2">
          <select id="sp-cliente-id" class="border p-2 rounded"></select>
          <button onclick="ejecutarSPCliente()" class="bg-teal-600 text-white px-4 py-2 rounded">Proced: Ventas por Clientes</button>
        </div>
      </div>
      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full text-left border-collapse">
          <thead class="bg-gray-800 text-white">
            <tr><th class="p-3">ID Venta</th><th class="p-3">Cliente</th><th class="p-3">Producto</th><th class="p-3">Total</th><th class="p-3">Fecha</th></tr>
          </thead>
          <tbody id="tbl-consultas"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script>
    let productoEnEdicion = null;
    let clienteEnEdicion = null;
    let productosActuales = [];
    let clientesActuales = [];

    async function api(url, options = {}) {
      const response = await fetch(url, options);
      let data;
      try {
        data = await response.json();
      } catch {
        throw new Error(`El servidor respondió con un formato inesperado (${response.status})`);
      }
      if (!response.ok) throw new Error(data.error || `Error HTTP ${response.status}`);
      return data;
    }

    function mostrarError(error) {
      console.error(error);
      alert(`No se pudo completar la operación: ${error.message}`);
    }

    function escaparHtml(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, caracter => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[caracter]);
    }

    function opcionesVacias(texto) {
      return `<option value="">${escaparHtml(texto)}</option>`;
    }

    function verModulo(nombre) {
      document.querySelectorAll('.modulo').forEach(m => m.classList.add('hidden'));
      document.getElementById(`mod-${nombre}`).classList.remove('hidden');
      if (nombre === 'productos') cargarProductos().catch(mostrarError);
      if (nombre === 'clientes') cargarClientes().catch(mostrarError);
      if (nombre === 'ventas') cargarSelectsVenta().catch(mostrarError);
      if (nombre === 'consultas') cargarSelectsConsultas().catch(mostrarError);
    }

    // --- CARGA DE PRODUCTOS ---
    async function cargarProductos() {
      productosActuales = await api('/api/productos');
      document.getElementById('tbl-productos').innerHTML = productosActuales.length
        ? productosActuales.map(p => `
          <tr class="border-b">
            <td class="p-3">${p.producto_id}</td>
            <td class="p-3">${escaparHtml(p.nombre_producto)}</td>
            <td class="p-3">${escaparHtml(p.categoria)}</td>
            <td class="p-3">$${escaparHtml(Number(p.precio).toFixed(2))}</td>
            <td class="p-3 whitespace-nowrap">
              <button type="button" data-action="editar-producto" data-id="${p.producto_id}" class="text-blue-700 mr-2">Editar</button>
              <button type="button" data-action="eliminar-producto" data-id="${p.producto_id}" class="text-red-700">Eliminar</button>
            </td>
          </tr>
        `).join('')
        : '<tr><td class="p-3 text-gray-500" colspan="5">No hay productos registrados.</td></tr>';
    }

    // --- CARGA DE CLIENTES ---
    async function cargarClientes() {
      clientesActuales = await api('/api/clientes');
      document.getElementById('tbl-clientes').innerHTML = clientesActuales.length
        ? clientesActuales.map(c => `
          <tr class="border-b">
            <td class="p-3">${c.cliente_id}</td>
            <td class="p-3">${escaparHtml(c.nombre)}</td>
            <td class="p-3">${escaparHtml(c.email)}</td>
            <td class="p-3">${escaparHtml(c.ciudad)}</td>
            <td class="p-3 whitespace-nowrap">
              <button type="button" data-action="editar-cliente" data-id="${c.cliente_id}" class="text-blue-700 mr-2">Editar</button>
              <button type="button" data-action="eliminar-cliente" data-id="${c.cliente_id}" class="text-red-700">Eliminar</button>
            </td>
          </tr>
        `).join('')
        : '<tr><td class="p-3 text-gray-500" colspan="5">No hay clientes registrados.</td></tr>';
    }

    // --- CARGA DE SELECTS ---
    async function cargarSelectsVenta() {
      const [clientes, productos] = await Promise.all([api('/api/clientes'), api('/api/productos')]);
      document.getElementById('v-cliente').innerHTML = clientes.length
        ? clientes.map(c => `<option value="${c.cliente_id}">${escaparHtml(c.nombre)}</option>`).join('')
        : opcionesVacias('Registra un cliente primero');
      document.getElementById('v-producto').innerHTML = productos.length
        ? productos.map(p => `<option value="${p.producto_id}">${escaparHtml(p.nombre_producto)} ($${escaparHtml(p.precio)})</option>`).join('')
        : opcionesVacias('Registra un producto primero');
    }

    async function cargarSelectsConsultas() {
      const clientes = await api('/api/clientes');
      document.getElementById('sp-cliente-id').innerHTML = clientes.length
        ? clientes.map(c => `<option value="${c.cliente_id}">${escaparHtml(c.nombre)}</option>`).join('')
        : opcionesVacias('No hay clientes para consultar');
    }

    document.getElementById('form-producto').addEventListener('submit', async event => {
      event.preventDefault();
      const datos = {
        nombre_producto: document.getElementById('p-nombre').value.trim(),
        categoria: document.getElementById('p-categoria').value.trim(),
        precio: document.getElementById('p-precio').value
      };
      try {
        const resultado = await api(productoEnEdicion ? `/api/productos/${productoEnEdicion}` : '/api/productos', {
          method: productoEnEdicion ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        alert(resultado.message || 'Producto guardado correctamente');
        resetearFormularioProducto();
        await cargarProductos();
      } catch (error) {
        mostrarError(error);
      }
    });

    document.getElementById('form-cliente').addEventListener('submit', async event => {
      event.preventDefault();
      const datos = {
        nombre: document.getElementById('c-nombre').value.trim(),
        email: document.getElementById('c-email').value.trim(),
        ciudad: document.getElementById('c-ciudad').value.trim()
      };
      try {
        const resultado = await api(clienteEnEdicion ? `/api/clientes/${clienteEnEdicion}` : '/api/clientes', {
          method: clienteEnEdicion ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(datos)
        });
        alert(resultado.message || 'Cliente guardado correctamente');
        resetearFormularioCliente();
        await cargarClientes();
      } catch (error) {
        mostrarError(error);
      }
    });

    function resetearFormularioProducto() {
      productoEnEdicion = null;
      document.getElementById('form-producto').reset();
      document.querySelector('#form-producto button[type="submit"]').textContent = 'Guardar Producto';
      document.getElementById('cancelar-producto').classList.add('hidden');
    }

    function resetearFormularioCliente() {
      clienteEnEdicion = null;
      document.getElementById('form-cliente').reset();
      document.querySelector('#form-cliente button[type="submit"]').textContent = 'Guardar Cliente';
      document.getElementById('cancelar-cliente').classList.add('hidden');
    }

    document.getElementById('cancelar-producto').addEventListener('click', resetearFormularioProducto);
    document.getElementById('cancelar-cliente').addEventListener('click', resetearFormularioCliente);

    document.getElementById('tbl-productos').addEventListener('click', async event => {
      const boton = event.target.closest('button[data-action]');
      if (!boton) return;
      const producto = productosActuales.find(item => String(item.producto_id) === boton.dataset.id);
      if (!producto) return;
      if (boton.dataset.action === 'editar-producto') {
        productoEnEdicion = producto.producto_id;
        document.getElementById('p-nombre').value = producto.nombre_producto;
        document.getElementById('p-categoria').value = producto.categoria;
        document.getElementById('p-precio').value = producto.precio;
        document.querySelector('#form-producto button[type="submit"]').textContent = 'Actualizar Producto';
        document.getElementById('cancelar-producto').classList.remove('hidden');
      } else if (boton.dataset.action === 'eliminar-producto' && confirm(`¿Eliminar el producto "${producto.nombre_producto}"?`)) {
        try {
          const resultado = await api(`/api/productos/${producto.producto_id}`, { method: 'DELETE' });
          alert(resultado.message);
          await cargarProductos();
        } catch (error) {
          mostrarError(error);
        }
      }
    });

    document.getElementById('tbl-clientes').addEventListener('click', async event => {
      const boton = event.target.closest('button[data-action]');
      if (!boton) return;
      const cliente = clientesActuales.find(item => String(item.cliente_id) === boton.dataset.id);
      if (!cliente) return;
      if (boton.dataset.action === 'editar-cliente') {
        clienteEnEdicion = cliente.cliente_id;
        document.getElementById('c-nombre').value = cliente.nombre;
        document.getElementById('c-email').value = cliente.email;
        document.getElementById('c-ciudad').value = cliente.ciudad;
        document.querySelector('#form-cliente button[type="submit"]').textContent = 'Actualizar Cliente';
        document.getElementById('cancelar-cliente').classList.remove('hidden');
      } else if (boton.dataset.action === 'eliminar-cliente' && confirm(`¿Eliminar al cliente "${cliente.nombre}"?`)) {
        try {
          const resultado = await api(`/api/clientes/${cliente.cliente_id}`, { method: 'DELETE' });
          alert(resultado.message);
          await cargarClientes();
        } catch (error) {
          mostrarError(error);
        }
      }
    });

    // --- FORMULARIO NUEVA VENTA (CALL SP) ---
    document.getElementById('form-venta').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const resultado = await api('/api/ventas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            cliente_id: document.getElementById('v-cliente').value,
            producto_id: document.getElementById('v-producto').value,
            cantidad: document.getElementById('v-cantidad').value
          })
        });
        alert(resultado.message);
      } catch (error) {
        mostrarError(error);
      }
    });

    // --- CONSULTAS (VISTA) ---
    async function cargarVistaVentas() {
      try {
        renderTablaConsultas(await api('/api/consultas/vista-ventas'));
      } catch (error) {
        mostrarError(error);
      }
    }

    // --- CONSULTAS (SP) ---
    async function ejecutarSPCliente() {
      const id = document.getElementById('sp-cliente-id').value;
      if (!id) {
        alert('Registra un cliente antes de ejecutar esta consulta.');
        return;
      }
      try {
        renderTablaConsultas(await api(`/api/consultas/ventas-cliente/${id}`));
      } catch (error) {
        mostrarError(error);
      }
    }

    function renderTablaConsultas(data) {
      document.getElementById('tbl-consultas').innerHTML = data.length
        ? data.map(v => `
          <tr class="border-b">
            <td class="p-3">${escaparHtml(v.venta_id)}</td>
            <td class="p-3">${escaparHtml(v.nombre_cliente)}</td>
            <td class="p-3">${escaparHtml(v.nombre_producto)}</td>
            <td class="p-3">$${escaparHtml(v.total)}</td>
            <td class="p-3">${escaparHtml(v.fecha_venta ? new Date(v.fecha_venta).toLocaleString() : '')}</td>
          </tr>
        `).join('')
        : '<tr><td class="p-3 text-gray-500" colspan="5">La consulta no devolvió resultados.</td></tr>';
    }

    api('/api/health')
      .then(() => {
        const estado = document.getElementById('estado-conexion');
        estado.textContent = 'Conexión con MySQL activa';
        estado.classList.replace('text-gray-400', 'text-green-400');
      })
      .catch(error => {
        const estado = document.getElementById('estado-conexion');
        estado.textContent = 'Error de conexión con MySQL';
        estado.classList.replace('text-gray-400', 'text-red-400');
        mostrarError(error);
      });

    cargarProductos().catch(mostrarError);
  </script>
</body>
</html>
